name: Collect stock screener

on:
  schedule:
    # Weekdays 09:00-15:30 KST every 30 minutes, plus 16:10 KST after the close.
    - cron: '*/30 0-6 * * 1-5'
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-screener-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python collect.py
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_screener.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged."
          else
            git commit -m "Update the stock screener snapshot."
            git push
          fi
